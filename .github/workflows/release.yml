name: Prepare GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Accepted package version, without v (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  draft:
    name: Gate and prepare draft release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit release preparation dependencies
        run: npm audit --audit-level=low
      - name: Require accepted commit and create draft only
        run: npm run release:prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
