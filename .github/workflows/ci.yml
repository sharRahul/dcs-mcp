name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows host compatibility; live DCS behavior is tested separately by the operator.
    name: Node ${{ matrix.node }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Tests that need DCS's own Lua (luae.exe) skip themselves unless DCS_LUA is set.
      - run: npm test
      - name: Package contents
        if: matrix.node == 22
        run: npm pack --dry-run
      - name: Offline capability acceptance artifact
        if: matrix.node == 22
        run: npm run verify:capabilities -- "${{ runner.temp }}/dcs-capability-proof"
      - name: Offline mission design acceptance artifact
        if: matrix.node == 22
        run: npm run verify:design -- "${{ runner.temp }}/dcs-capability-proof/design"
      - name: Upload offline evidence (not DCS-verified)
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: offline-capability-proof
          path: ${{ runner.temp }}/dcs-capability-proof

      - name: Generate live acceptance kit (offline checks only)
        if: matrix.node == 22
        run: npm run acceptance:generate -- "${{ runner.temp }}/live-acceptance"
      - name: Upload live acceptance kit (DCS flight tests pending)
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-kit-offline-only
          path: ${{ runner.temp }}/live-acceptance

  lua51:
    name: Lua 5.1 offline checks on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Build pinned stock Lua 5.1.5 (not DCS)
        shell: pwsh
        run: ./scripts/build-lua51.ps1 -OutputDirectory "${{ runner.temp }}/stock-lua51"
      - run: npm ci
      - run: npm run build
      - run: npm run verify:lua51
      - run: npm run verify:design -- "${{ runner.temp }}/lua51-design-proof"
      - name: Mocked hook load and protocol checks
        shell: pwsh
        run: |
          & $env:LUA51 tests/fixtures/hook-load.lua scripts/Hooks/dcs-mcp-hook.lua
          if ($LASTEXITCODE -ne 0) { throw 'Hook load checks failed' }
          & $env:LUA51 tests/fixtures/hook-runtime.lua scripts/Hooks/dcs-mcp-hook.lua
          if ($LASTEXITCODE -ne 0) { throw 'Hook runtime checks failed' }
      - run: npm run acceptance:generate -- "${{ runner.temp }}/lua51-live-acceptance"
      - run: npm run acceptance:lua51 -- "${{ runner.temp }}/lua51-live-acceptance"
      - name: Upload Lua 5.1 acceptance evidence (offline only)
        uses: actions/upload-artifact@v4
        with:
          name: windows-lua51-offline-proof
          path: |
            ${{ runner.temp }}/lua51-design-proof
            ${{ runner.temp }}/lua51-live-acceptance
